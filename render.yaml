services:
  - type: web
    name: nodal-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Add these in Render Dashboard → Environment Variables:
      # - MONGO_URI: Your MongoDB Atlas connection string
      # - FRONTEND_URL: Your Vercel frontend URL (e.g., https://nodal-ecru.vercel.app)
      # - ADMIN_PASSCODE: (optional) Passcode for blog management
      # - CLOUDINARY_CLOUD_NAME: Your Cloudinary cloud name (for image storage)
      # - CLOUDINARY_API_KEY: Your Cloudinary API key
      # - CLOUDINARY_API_SECRET: Your Cloudinary API secret
  # Pair Screener (Streamlit), embedded in the Resources page's "Pair Screener" tab.
  # After it deploys, set VITE_PAIR_SCREENER_URL on Vercel to this service's URL.
  - type: web
    name: nodal-pair-screener
    env: python
    plan: free
    rootDir: pythonscreening
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      # Keep memory under the free plan's 512MB: one BLAS thread (the matrix
      # multiply is small) and fewer glibc malloc arenas for Streamlit's threads.
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      # Lets the app's "Refresh data" button start the refresh workflow; set it in
      # the dashboard. See pythonscreening/README.md, Deploying.
      - key: GITHUB_TOKEN
        sync: false
