# Matches the Nodal site: Montserrat, black accents, white cards.
[theme]
base = "light"
primaryColor = "#000000"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f5"
textColor = "#0f172a"
borderColor = "#e5e7eb"
font = "Montserrat:https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
baseRadius = "6px"

[client]
toolbarMode = "minimal"

[server]
headless = true

[browser]
gatherUsageStats = false
